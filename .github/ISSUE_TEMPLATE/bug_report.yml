name: Bug report
description: Something renders wrong, crashes, or doesn't behave as documented.
title: "fix: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Rendering / canvas animation
        - Component API (props, types)
        - Build & packaging
        - Documentation / developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour. Paste any console errors verbatim.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet beats a description. Link a StackBlitz or repo if you have one.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: "19.3.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: "Firefox 142 on Arch Linux"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Bundler, SSR framework, screen size, or anything else that might matter.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
          required: false
