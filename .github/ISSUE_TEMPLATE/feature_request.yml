name: Feature request
description: Propose a new capability or an improvement to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Rendering / canvas animation
        - Component API (props, types)
        - Build & packaging
        - Documentation / developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What can't you do today, or what is awkward about the current behaviour?
      placeholder: |
        Currently the component always fills the viewport, so it can't be used
        inside a bounded container.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch the API if it adds or changes props.
      placeholder: |
        Accept an optional `fit` prop: `"viewport"` (default) or `"container"`.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you didn't pick them.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist that tells a reviewer this is done.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Anything the change must not break, such as the public API or bundle size.
      placeholder: |
        - must stay backwards compatible for existing `src`/`alt` consumers
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (may need design discussion first).
          required: false
